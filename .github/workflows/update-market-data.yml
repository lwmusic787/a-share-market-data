name: Update A-share Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and update data
        run: |
          SCRIPT=$(find . -path "*/scripts/update_data.py" -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "Cannot find update_data.py"
            exit 1
          fi

          BASE=$(dirname "$(dirname "$SCRIPT")")
          python -m pip install -r "$BASE/requirements.txt"
          python "$SCRIPT"

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update A-share market data"
            git push
          fi
